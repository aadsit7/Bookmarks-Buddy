<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bookmarks Buddy — open your sites by voice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Bookmarks Buddy — save your favorite links and open them hands-free with your voice.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        /* Design tokens (carried over from the original product so Bookmarks
           Buddy still feels like the same family) */
        --navy: #1F289C;
        --navy-deep: #161F5B;
        --primary: #0372FF;
        --primary-hover: #0262DB;
        --primary-press: #014BAC;
        --cyan: #31D1FF;
        --cyan-hi: #7FE3FF;
        --dark: #161F5B;
        --gray: #4D5878;
        --muted-blue: #AAB6E8;
        --quote: #F0F6FF;
        --divider: #DCE2EC;
        --n25: #FBFCFE;
        --n50: #F5F7FB;
        --n100: #EDF0F7;
        --n200: #DCE2EC;
        --n300: #C3CBDC;
        --n400: #97A2BB;
        --n500: #6B7693;
        --n600: #4D5878;
        --green: #0F7A3F;
        --amber: #B45309;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow-card: 0 2px 6px rgba(22,31,91,0.08);
        --shadow-hover: 0 8px 24px rgba(22,31,91,0.10);
        --shadow-brand: 0 8px 24px rgba(3,114,255,0.22);
        --focus-ring: 0 0 0 4px rgba(3,114,255,0.25);
        --ease: cubic-bezier(.16,1,.3,1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; background: var(--n50); color: var(--dark); font-family: 'DM Sans', system-ui, sans-serif; }
      body { margin: 0; overflow: hidden; }
      #app { height: 100dvh; }
      *::-webkit-scrollbar { width: 9px; height: 9px; }
      *::-webkit-scrollbar-thumb { background: var(--n300); border-radius: 5px; }
      *::-webkit-scrollbar-track { background: transparent; }
      svg.lucide { width: 1em; height: 1em; }
      button { font-family: inherit; }
      :is(button, [role="button"], [role="switch"]):focus-visible { outline: none; box-shadow: var(--focus-ring); }

      input[type="text"], input[type="url"] {
        width: 100%; padding: 11px 14px; border: 1.5px solid var(--n200); border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 500; color: var(--navy-deep); background: #fff; outline: none;
        transition: border-color 0.16s, box-shadow 0.16s; font-family: inherit;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(3,114,255,0.12); }
      input::placeholder { color: var(--n400); font-weight: 500; }

      .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--primary); color: #fff; border: none; border-radius: 999px; padding: 11px 22px; min-height: 44px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: background 0.12s, transform 0.12s; }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-primary:active { transform: scale(0.98); }
      .btn-primary:disabled { background: var(--n200); color: #fff; cursor: not-allowed; }
      .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: transparent; color: var(--navy-deep); border: 1.5px solid var(--n300); border-radius: 999px; padding: 10px 18px; min-height: 42px; font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color 0.12s, color 0.12s, background 0.12s; }
      .btn-outline:hover { color: var(--primary); border-color: var(--primary); background: var(--quote); }
      .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--n100); border: none; color: var(--navy-deep); font-size: 12.5px; font-weight: 600; padding: 9px 15px; border-radius: 999px; cursor: pointer; transition: background 0.12s; }
      .btn-ghost:hover { background: var(--n200); }

      /* ================= App shell ================= */
      .shell { display: flex; flex-direction: column; height: 100dvh; }

      .topbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; min-height: 62px; background: var(--navy); color: #fff; flex-shrink: 0; z-index: 20; }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, var(--primary), var(--cyan)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 14px rgba(3,114,255,0.4); flex-shrink: 0; }
      .brand-mark svg { width: 21px; height: 21px; }
      .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
      .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
      .brand-name .accent { color: var(--cyan); }
      .brand-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted-blue); margin-top: 2px; }

      .nav-tabs { display: flex; gap: 4px; margin-left: 8px; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 999px; }
      .nav-tab { display: inline-flex; align-items: center; gap: 7px; border: none; background: transparent; color: var(--muted-blue); font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background 0.14s, color 0.14s; }
      .nav-tab svg { width: 15px; height: 15px; }
      .nav-tab:hover { color: #fff; }
      .nav-tab.active { background: #fff; color: var(--navy); }
      .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); margin-left: -2px; align-self: flex-start; box-shadow: 0 0 0 2px rgba(255,255,255,0.18); }

      @keyframes statusPulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); } 100% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } }

      .page { flex: 1; min-height: 0; overflow-y: auto; background: var(--n50); }

      /* ================= Home: side-by-side ================= */
      .home { max-width: 1180px; margin: 0 auto; padding: 24px 22px 40px; }
      .home-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 22px; align-items: start; }

      .panel { background: #fff; border: 1px solid var(--divider); border-radius: var(--radius); box-shadow: var(--shadow-card); overflow: hidden; }
      .panel-head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--divider); }
      .panel-head-ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; background: var(--quote); color: var(--primary); }
      .panel-head-ic svg { width: 20px; height: 20px; }
      .panel-head-ic.cyan { background: rgba(49,209,255,0.16); color: var(--navy-deep); }
      .panel-titles { flex: 1; min-width: 0; }
      .panel-title { font-size: 16px; font-weight: 800; color: var(--navy-deep); letter-spacing: -0.01em; }
      .panel-sub { font-size: 12px; color: var(--n500); margin-top: 2px; line-height: 1.35; }
      .panel-body { padding: 18px 22px 22px; }

      /* Add-bookmark form */
      .bm-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; }
      .bm-add .btn-primary { min-height: 44px; padding: 0 18px; }
      .bm-add-hint { font-size: 11.5px; color: var(--n500); margin-top: 9px; display: flex; align-items: center; gap: 6px; }
      .bm-add-hint svg { width: 13px; height: 13px; color: var(--n400); }

      .bm-divider { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 12px; }
      .bm-count { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n500); }

      .bm-list { display: flex; flex-direction: column; gap: 8px; }
      .bm-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 1.5px solid var(--n200); border-radius: 12px; background: var(--n25); transition: border-color 0.14s, box-shadow 0.14s, background 0.14s; }
      .bm-item:hover { border-color: var(--n300); box-shadow: var(--shadow-card); }
      .bm-item.matched { border-color: var(--cyan); background: var(--quote); box-shadow: 0 0 0 4px rgba(49,209,255,0.18); animation: matchPop 0.4s var(--ease); }
      @keyframes matchPop { 0% { transform: scale(0.99); } 50% { transform: scale(1.012); } 100% { transform: scale(1); } }
      .bm-fav { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; background: #fff; border: 1px solid var(--n200); overflow: hidden; color: var(--primary); font-weight: 800; font-size: 15px; }
      .bm-fav img { width: 20px; height: 20px; display: block; }
      .bm-body { flex: 1; min-width: 0; cursor: pointer; }
      .bm-name { font-size: 14px; font-weight: 700; color: var(--navy-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bm-url { font-size: 11.5px; color: var(--n500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .bm-actions { display: flex; gap: 4px; flex-shrink: 0; }
      .bm-actions button { width: 34px; height: 34px; border-radius: 9px; border: none; background: transparent; color: var(--n500); cursor: pointer; display: grid; place-items: center; transition: background 0.12s, color 0.12s; }
      .bm-actions button svg { width: 16px; height: 16px; }
      .bm-actions button:hover { background: var(--n100); color: var(--navy-deep); }
      .bm-actions button.open:hover { background: var(--quote); color: var(--primary); }
      .bm-actions button.del:hover { background: #fee2e2; color: #dc2626; }

      /* Inline edit + delete-confirm */
      .bm-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }
      .bm-edit input { padding: 8px 11px; font-size: 13px; }
      .bm-confirm { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; }
      .bm-confirm span { font-size: 12.5px; font-weight: 600; color: #b91c1c; }
      .bm-confirm .yes { background: #dc2626; color: #fff; border: none; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
      .bm-confirm .yes:hover { background: #b91c1c; }

      .bm-empty { text-align: center; padding: 30px 16px; color: var(--n500); }
      .bm-empty svg { width: 30px; height: 30px; color: var(--n300); margin-bottom: 10px; }
      .bm-empty p { font-size: 13px; line-height: 1.6; }

      .save-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider); }
      .save-status { font-size: 12px; font-weight: 600; color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
      .save-status svg { width: 14px; height: 14px; }

      /* ================= Voice panel ================= */
      .vp-body { padding: 26px 22px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; }

      .orb-wrap { position: relative; width: 132px; height: 132px; display: grid; place-items: center; flex-shrink: 0; }
      .orb-wrap .orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--cyan); opacity: 0; pointer-events: none; }
      .orb-wrap.live .orb-ring { animation: orbPulse 1.9s ease-out infinite; opacity: .5; }
      .orb-wrap.live .orb-ring.d { animation-delay: .95s; }
      @keyframes orbPulse { 0%{transform:scale(1);opacity:.55} 100%{transform:scale(1.5);opacity:0} }
      .voice-orb { position: relative; z-index: 1; width: 108px; height: 108px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; color: #fff; background: var(--primary); box-shadow: var(--shadow-brand); transition: transform .18s var(--ease), background .2s, box-shadow .2s, color .2s; }
      .voice-orb svg { width: 38px; height: 38px; }
      .voice-orb:hover { transform: scale(1.04); }
      .voice-orb:active { transform: scale(.97); }
      .voice-orb.off:hover { background: var(--primary-hover); }
      .voice-orb.on { background: #fff; color: var(--primary); box-shadow: 0 0 0 7px rgba(49,209,255,.26), var(--shadow-hover); }
      .voice-orb:disabled { background: var(--n100); color: var(--n400); cursor: not-allowed; box-shadow: none; transform: none; }

      .vp-status { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--navy-deep); background: var(--n100); padding: 7px 16px; border-radius: 999px; }
      .vp-status .st-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--n400); flex-shrink: 0; }
      .vp-status.on { background: var(--quote); color: var(--navy); }
      .vp-status.on .st-dot { background: #10b981; animation: dotBlink 1.5s ease-out infinite; }
      @keyframes dotBlink { 50% { opacity: 0.35; } }

      .vp-transcript { margin-top: 18px; width: 100%; min-height: 46px; font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--navy-deep); letter-spacing: -0.01em; text-wrap: pretty; overflow-wrap: break-word; }
      .vp-transcript.muted { color: var(--n400); font-weight: 500; font-size: 14px; }
      .vp-transcript .caret { display: inline-block; width: 2px; height: 1em; background: var(--primary); margin-left: 2px; vertical-align: text-bottom; animation: caretBlink 1s step-end infinite; }
      @keyframes caretBlink { 50% { opacity: 0; } }

      .vp-examples { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
      .vp-chip { font-size: 12px; font-weight: 600; color: var(--n600); background: var(--n50); border: 1px solid var(--n200); border-radius: 999px; padding: 6px 13px; }
      .vp-chip b { color: var(--primary); font-weight: 700; }

      /* Keyboard-shortcut hint (Ctrl+Alt+B launches listening) */
      .vp-shortcut { margin-top: 16px; font-size: 12px; font-weight: 600; color: var(--n500); line-height: 1.95; }
      kbd { display: inline-block; font-family: inherit; font-size: 11px; font-weight: 700; line-height: 1; color: var(--navy-deep); background: #fff; border: 1px solid var(--n300); border-bottom-width: 2px; border-radius: 6px; padding: 3px 6px; vertical-align: baseline; }

      .vp-options { margin-top: 20px; width: 100%; padding-top: 16px; border-top: 1px solid var(--divider); display: flex; flex-direction: column; gap: 10px; }
      .opt-row { display: flex; align-items: center; gap: 12px; text-align: left; }
      .opt-row .opt-text { flex: 1; min-width: 0; }
      .opt-title { font-size: 13px; font-weight: 700; color: var(--navy-deep); }
      .opt-sub { font-size: 11.5px; color: var(--n500); line-height: 1.35; margin-top: 1px; }

      .switch { position: relative; display: inline-flex; align-items: center; width: 44px; height: 24px; border-radius: 999px; background: var(--n300); cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
      .switch.on { background: var(--primary); }
      .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.2s; box-shadow: 0 1px 3px rgba(22,31,91,0.2); }
      .switch.on::after { left: 22px; }

      /* Recent actions */
      .recent { margin-top: 22px; }
      .recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .recent-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n500); }
      .recent-clear { font-size: 11.5px; font-weight: 600; color: var(--n500); background: none; border: none; cursor: pointer; }
      .recent-clear:hover { color: var(--primary); }
      .recent-list { display: flex; flex-direction: column; gap: 7px; }
      .recent-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; background: var(--n25); border: 1px solid var(--n200); }
      .recent-ic { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; }
      .recent-ic svg { width: 15px; height: 15px; }
      .recent-ic.opened { background: var(--quote); color: var(--primary); }
      .recent-ic.split { background: #eef2ff; color: #4f46e5; }
      .recent-ic.added { background: #ecfdf5; color: var(--green); }
      .recent-ic.blocked { background: #fffbeb; color: var(--amber); }
      .recent-ic.notfound { background: #fef2f2; color: #dc2626; }
      .recent-ic.info { background: var(--n100); color: var(--n600); }
      .recent-body { flex: 1; min-width: 0; }
      .recent-main { font-size: 13px; font-weight: 600; color: var(--navy-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .recent-time { font-size: 11px; color: var(--n500); margin-top: 1px; }
      .recent-empty { font-size: 12.5px; color: var(--n500); text-align: center; padding: 16px; line-height: 1.6; }

      /* Pending-open banner (popup blocked → one tap to open) */
      .pending { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 13px 15px; border-radius: 12px; background: #fffbeb; border: 1.5px solid #fcd34d; animation: slideDown 0.22s var(--ease); }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
      .pending-ic { width: 36px; height: 36px; border-radius: 10px; background: #fef3c7; color: var(--amber); display: grid; place-items: center; flex-shrink: 0; }
      .pending-ic svg { width: 19px; height: 19px; }
      .pending-body { flex: 1; min-width: 0; }
      .pending-title { font-size: 13.5px; font-weight: 700; color: #92400e; }
      .pending-sub { font-size: 11.5px; color: #b45309; margin-top: 1px; line-height: 1.4; }
      .pending .btn-primary { background: var(--amber); min-height: 40px; padding: 0 18px; }
      .pending .btn-primary:hover { background: #92400e; }
      .pending-x { width: 32px; height: 32px; border: none; background: transparent; color: #b45309; border-radius: 8px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
      .pending-x:hover { background: rgba(180,83,9,0.12); }

      /* ================= Focus screen ================= */
      .focus { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 5vh 22px 40px; }
      .focus-inner { width: 100%; max-width: 620px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .focus .orb-wrap { width: 184px; height: 184px; margin-bottom: 6px; }
      .focus .voice-orb { width: 150px; height: 150px; }
      .focus .voice-orb svg { width: 52px; height: 52px; }
      .focus-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy-deep); margin-top: 22px; }
      .focus-sub { font-size: 14px; color: var(--gray); line-height: 1.6; margin-top: 8px; max-width: 440px; }
      .focus-transcript { margin-top: 26px; width: 100%; min-height: 54px; font-size: 24px; font-weight: 600; line-height: 1.4; color: var(--navy-deep); letter-spacing: -0.01em; text-wrap: pretty; overflow-wrap: break-word; }
      .focus-transcript.muted { color: var(--n400); font-weight: 500; font-size: 17px; }
      .focus-transcript .caret { display: inline-block; width: 3px; height: 1em; background: var(--primary); margin-left: 3px; vertical-align: text-bottom; animation: caretBlink 1s step-end infinite; }
      .focus-recent { margin-top: 30px; width: 100%; max-width: 480px; text-align: left; }

      /* ============== What's new (recent updates) ============== */
      .whatsnew { margin-top: 30px; width: 100%; max-width: 480px; text-align: left; }
      .whatsnew-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .whatsnew-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n500); }
      .whatsnew-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #fff; background: var(--primary); border-radius: 999px; padding: 3px 8px; }
      .whatsnew-list { display: flex; flex-direction: column; gap: 10px; }
      .wn-entry { padding: 13px 15px; border-radius: 14px; background: var(--n25); border: 1px solid var(--n200); }
      .wn-entry.latest { background: rgba(3,114,255,0.05); border-color: rgba(3,114,255,0.28); }
      .wn-entry-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
      .wn-entry-title { font-size: 13.5px; font-weight: 800; color: var(--navy-deep); letter-spacing: -0.01em; }
      .wn-entry-date { font-size: 11px; font-weight: 600; color: var(--n500); white-space: nowrap; }
      .wn-bullets { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 4px; }
      .wn-bullets li { font-size: 12.5px; line-height: 1.4; color: var(--navy-deep); }
      .wn-bullets li::marker { color: var(--primary); }

      /* ================= Toast ================= */
      .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 200; background: var(--navy-deep); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 20px 48px rgba(22,31,91,0.32); pointer-events: none; animation: toastIn 0.25s ease-out; max-width: min(92vw, 480px); text-align: center; display: inline-flex; align-items: center; gap: 9px; }
      .toast svg { width: 17px; height: 17px; flex-shrink: 0; }
      @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

      /* ================= iPhone-style springboard ================= */
      /* The bookmarks page is laid out like an iPhone home screen: a grid of
         app icons (the website URLs) spread across swipeable pages, folders to
         group them, and a pencil button (bottom-left) that enters "jiggle"
         edit mode for dragging things around. */
      .home-springboard { max-width: none; margin: 0; padding: 18px 26px 24px; display: flex; flex-direction: column; min-height: 100%; }

      .springboard {
        position: relative;
        flex: 1;
        display: flex; flex-direction: column;
        min-height: min(70vh, 720px);
        border-radius: 30px;
        padding: 16px 12px 0;
        overflow: hidden;
        border: 1px solid var(--n200);
        /* Pearl-white surface — a soft, slightly iridescent off-white so the
           white app tiles read against it via their own light-gray shadow. */
        background:
          radial-gradient(135% 95% at 12% 0%, #ffffff, rgba(255,255,255,0) 55%),
          radial-gradient(120% 120% at 100% 0%, #eef0f6, rgba(238,240,246,0) 60%),
          linear-gradient(165deg, #f7f8fb 0%, #eceef4 100%);
        box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.9);
      }

      .sb-viewport { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
      .springboard.editing, .springboard.editing .sb-viewport { touch-action: none; }
      .sb-track { display: flex; height: 100%; transition: transform .32s var(--ease); will-change: transform; }
      .sb-page {
        flex: 0 0 auto;
        display: grid; grid-template-columns: repeat(auto-fill, 120px); justify-content: space-evenly;
        grid-auto-rows: min-content;
        gap: 30px 0; align-content: start; padding: 18px 20px 22px;
      }
      .sb-empty-page { grid-column: 1 / -1; text-align: center; color: var(--n500); font-size: 13.5px; line-height: 1.6; padding: 48px 12px; }

      .sb-cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
      .sb-tile, .sb-folder {
        position: relative; width: 80px; height: 80px; border-radius: 20px; cursor: pointer;
        display: grid; place-items: center; overflow: hidden;
        background: #fff;
        border: 1px solid rgba(120,130,160,0.16);
        /* Soft light-gray shadow so each white tile stays clearly readable on
           the pearl-white board. */
        box-shadow: 0 6px 16px rgba(60,64,80,0.16), 0 1px 4px rgba(60,64,80,0.10);
        transition: transform .14s var(--ease), box-shadow .16s, outline-color .14s;
      }
      .sb-tile:hover, .sb-folder:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(60,64,80,0.22), 0 2px 6px rgba(60,64,80,0.12); }
      .sb-tile img { width: 50px; height: 50px; display: block; -webkit-user-drag: none; user-drag: none; pointer-events: none; }
      .sb-tile .sb-letter { font-size: 34px; font-weight: 800; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.25); }
      .sb-tile.noimg { background: var(--primary); }
      .sb-tile.noimg::after { content: attr(data-letter); font-size: 34px; font-weight: 800; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.25); }
      .sb-label {
        font-size: 15px; font-weight: 600; color: var(--navy-deep); text-align: center; line-height: 1.2;
        /* Show the bookmark's full title under each tile. The title wraps onto
           as many rows as it needs (no clamping or ellipsis) so nothing is ever
           cut off — readability of the full name matters more than keeping every
           label to one line. */
        max-width: 116px; white-space: normal; overflow-wrap: break-word;
        text-shadow: 0 1px 2px rgba(255,255,255,0.7);
      }

      /* Empty grid slot — an invisible placeholder that holds a position open so
         apps and folders can stay exactly where they're dropped, leaving gaps
         anywhere on the page just like an iPhone home screen. It mirrors a real
         cell's footprint (tile + label) so the grid stays perfectly aligned. */
      .sb-slot-empty { pointer-events: none; }
      .sb-slot-empty .sb-tile-ghost { width: 80px; height: 80px; border-radius: 20px; border: 2px dashed transparent; transition: border-color .14s, background .14s; }
      .springboard.editing .sb-slot-empty { pointer-events: auto; }
      .springboard.editing .sb-slot-empty .sb-tile-ghost { border-color: rgba(22,31,91,0.16); background: rgba(255,255,255,0.30); }
      .sb-cell.drop-slot .sb-tile-ghost { border-color: var(--primary); border-style: solid; background: var(--quote); }
      .sb-cell.drop-swap .sb-tile, .sb-cell.drop-swap .sb-folder { outline: 3px dashed var(--primary); outline-offset: 2px; }

      /* Folder tile — a frosted square holding a 3×3 preview of its apps */
      .sb-folder { background: rgba(118,128,155,0.18); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 6px; }
      .sb-folder-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; }
      .sb-mini { border-radius: 5px; background: rgba(255,255,255,0.95); display: grid; place-items: center; overflow: hidden; }
      .sb-mini img { width: 100%; height: 100%; object-fit: contain; padding: 1px; -webkit-user-drag: none; user-drag: none; pointer-events: none; }

      /* Jiggle / edit mode */
      .sb-badge {
        position: absolute; top: -7px; left: -7px; z-index: 3;
        width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
        background: #fff; color: #1a1a1a; box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        display: grid; place-items: center;
      }
      .sb-badge svg { width: 13px; height: 13px; }
      .springboard.editing .sb-cell:not(.sb-slot-empty) { animation: jiggle .32s infinite; }
      .springboard.editing .sb-cell:nth-child(even):not(.sb-slot-empty) { animation-delay: -.16s; }
      .springboard.editing .sb-tile, .springboard.editing .sb-folder { cursor: grab; }
      .sb-cell.dragging { opacity: .28; }
      @keyframes jiggle { 0% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.3deg); } 100% { transform: rotate(-1.2deg); } }

      /* Floating clone that follows the finger/cursor while dragging — the
         "lift and carry" gesture that makes rearranging feel like an iPhone. */
      .sb-ghost {
        position: fixed; left: 0; top: 0; z-index: 9999; margin: 0;
        display: flex; flex-direction: column; align-items: center; gap: 7px;
        pointer-events: none; transform-origin: 0 0; will-change: transform;
        filter: drop-shadow(0 16px 28px rgba(22,31,91,0.32));
      }
      .sb-ghost .sb-label { color: var(--navy-deep); text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

      /* Drop indicators while dragging */
      .sb-cell.drop-before::before, .sb-cell.drop-after::after {
        content: ''; position: absolute; top: 2px; bottom: 24px; width: 4px; border-radius: 3px;
        background: var(--primary); box-shadow: 0 0 8px rgba(3,114,255,0.5); z-index: 4;
      }
      .sb-cell.drop-before::before { left: -7px; }
      .sb-cell.drop-after::after { right: -7px; }
      .sb-cell.drop-folder .sb-tile, .sb-cell.drop-folder .sb-folder { outline: 3px solid var(--primary); transform: scale(1.09); }
      .sb-page.drop-page { outline: 2px dashed rgba(22,31,91,0.28); outline-offset: -10px; border-radius: 18px; }
      .sb-folder-panel.pop-out { box-shadow: 0 30px 70px rgba(22,31,91,0.42), 0 0 0 3px rgba(3,114,255,0.45); }

      /* Page dots */
      .sb-dots { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 0 4px; }
      .sb-dot { width: 8px; height: 8px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: rgba(22,31,91,0.2); transition: background .15s, transform .15s; }
      .sb-dot.active { background: var(--primary); transform: scale(1.18); }
      /* "Add a page" pill that sits at the end of the dot strip (edit mode) */
      .sb-dot-add { width: 20px; height: 20px; border-radius: 50%; border: none; padding: 0; cursor: pointer; margin-left: 4px; display: grid; place-items: center; background: rgba(22,31,91,0.08); color: var(--n600); transition: background .15s, transform .12s; }
      .sb-dot-add:hover { background: rgba(22,31,91,0.16); }
      .sb-dot-add:active { transform: scale(.9); }
      .sb-dot-add svg { width: 13px; height: 13px; }

      /* Page arrows — iPhone-style left/right navigation, overlaid on the
         springboard edges and usable with a mouse (swipe still works on touch) */
      .sb-arrow {
        position: absolute; top: 50%; transform: translateY(-50%); z-index: 6;
        width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--n200); cursor: pointer;
        display: grid; place-items: center; color: var(--navy-deep);
        background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        box-shadow: 0 4px 14px rgba(22,31,91,0.12);
        transition: background .14s, opacity .18s, transform .12s;
      }
      .sb-arrow:hover { background: #fff; }
      .sb-arrow:active { transform: translateY(-50%) scale(.92); }
      .sb-arrow svg { width: 22px; height: 22px; }
      .sb-arrow-prev { left: 12px; }
      .sb-arrow-next { right: 12px; }
      .sb-arrow.disabled { opacity: 0; pointer-events: none; }

      /* Springboard footer — the rearrange hint under the app grid */
      .sb-dock {
        display: flex; align-items: center; gap: 12px; margin-top: auto;
        padding: 12px 14px 16px; border-top: 1px solid var(--n200); background: rgba(255,255,255,0.45);
      }
      /* Rearrange toggle — lives in the home action bar (see .home-edit) */
      .sb-edit-btn {
        width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer; flex-shrink: 0;
        display: grid; place-items: center; background: rgba(22,31,91,0.06); color: var(--navy-deep);
        transition: background .14s, transform .12s, color .14s;
      }
      .sb-edit-btn:hover { background: rgba(22,31,91,0.12); }
      .sb-edit-btn:active { transform: scale(.95); }
      .sb-edit-btn svg { width: 20px; height: 20px; }
      .sb-edit-btn.on { background: var(--navy); color: #fff; }
      .sb-dock-hint { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: var(--n500); text-align: center; }

      /* Overlays: folder view + add/edit/delete modals */
      .sb-overlay { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 20px; }
      .sb-overlay-bg { position: absolute; inset: 0; background: rgba(22,31,91,0.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
      .sb-folder-panel, .modal {
        position: relative; z-index: 1; width: 100%; max-width: 440px;
        background: #fff; border-radius: 20px; box-shadow: 0 30px 70px rgba(22,31,91,0.42);
        animation: modalIn .2s var(--ease);
      }
      @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

      .sb-folder-panel { max-width: 520px; padding: 18px; }
      .sb-folder-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .sb-folder-title { flex: 1; font-size: 18px; font-weight: 800; color: var(--navy-deep); }
      .sb-folder-head input { flex: 1; }
      .sb-folder-close { width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; flex-shrink: 0; background: var(--n100); color: var(--navy-deep); display: grid; place-items: center; }
      .sb-folder-close:hover { background: var(--n200); }
      .sb-folder-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 8px; }
      .sb-folder-apps .sb-tile { box-shadow: 0 4px 10px rgba(22,31,91,0.14); }
      .sb-folder-apps .sb-label { color: var(--navy-deep); text-shadow: none; }
      .sb-folder-apps .sb-badge { background: #dc2626; color: #fff; }

      .modal { padding: 22px; max-height: calc(100dvh - 40px); overflow-y: auto; }
      .modal-title { font-size: 18px; font-weight: 800; color: var(--navy-deep); }
      .modal-sub { font-size: 13px; color: var(--n500); margin-top: 6px; line-height: 1.5; }
      .modal-fields { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
      .modal-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .modal-actions .del-text { color: #dc2626; }
      .btn-primary.danger { background: #dc2626; }
      .btn-primary.danger:hover { background: #b91c1c; }
      .modal-confirm { text-align: center; }
      .modal-confirm .modal-actions { justify-content: center; }
      .modal-ic-del { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 12px; background: #fee2e2; color: #dc2626; display: grid; place-items: center; }
      .modal-ic-del svg { width: 24px; height: 24px; }

      /* Optional description note + custom thumbnail controls in the add/edit
         modals. The note feeds the voice matcher; the thumbnail overrides the
         site favicon. Both are fully optional and degrade to today's behaviour
         when left blank. */
      .field-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--n500); margin: 4px 0 -2px; display: flex; align-items: center; gap: 6px; }
      .field-label .opt { color: var(--n400); font-weight: 600; letter-spacing: 0; text-transform: none; }
      .modal-fields textarea {
        width: 100%; padding: 11px 14px; border: 1.5px solid var(--n200); border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 500; color: var(--navy-deep); background: #fff; outline: none;
        transition: border-color 0.16s, box-shadow 0.16s; font-family: inherit; resize: vertical; min-height: 64px; line-height: 1.45;
      }
      .modal-fields textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(3,114,255,0.12); }
      .modal-fields textarea::placeholder { color: var(--n400); font-weight: 500; }
      .thumb-row { display: flex; align-items: center; gap: 12px; }
      .thumb-prev { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; background: var(--n25); border: 1px solid var(--n200); overflow: hidden; color: var(--primary); font-weight: 800; font-size: 18px; }
      .thumb-prev.noimg { color: #fff; border-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
      .thumb-prev img { width: 30px; height: 30px; object-fit: contain; display: block; }
      .thumb-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      .thumb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .thumb-actions .btn-ghost { font-size: 12px; padding: 8px 13px; }
      .thumb-actions .btn-ghost svg { width: 14px; height: 14px; }
      .thumb-upload { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
      .thumb-upload input[type="file"] { display: none; }

      /* Listen tab extras (carried over from the old voice panel) */
      .focus-options { margin-top: 24px; width: 100%; max-width: 420px; padding-top: 16px; border-top: 1px solid var(--divider); }

      /* ================= Onboarding (first run, no bookmarks) ================= */
      .onboard { max-width: 880px; margin: 0 auto; padding: 34px 22px 48px; }
      .onboard-hero { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--divider); border-radius: 24px; box-shadow: var(--shadow-card); padding: 42px 38px 38px; text-align: center; }
      .onboard-hero::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 180px; background: radial-gradient(120% 100% at 50% 0%, rgba(49,209,255,0.16), transparent 72%); pointer-events: none; }
      .onboard-mark { position: relative; width: 66px; height: 66px; border-radius: 19px; background: linear-gradient(140deg, var(--primary), var(--cyan)); display: grid; place-items: center; color: #fff; margin: 0 auto 20px; box-shadow: var(--shadow-brand); }
      .onboard-mark svg { width: 33px; height: 33px; }
      .onboard-title { position: relative; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy-deep); line-height: 1.12; }
      .onboard-sub { position: relative; font-size: 15px; line-height: 1.62; color: var(--gray); margin: 12px auto 0; max-width: 470px; text-wrap: pretty; }
      .onboard-sub b { color: var(--navy-deep); font-weight: 700; }
      .onboard-cta { position: relative; display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
      .onboard-cta .btn-primary { min-height: 48px; padding: 0 24px; font-size: 14px; }
      .onboard-cta .btn-outline { min-height: 48px; padding: 0 20px; font-size: 13.5px; }
      .onboard-divider { position: relative; display: flex; align-items: center; gap: 14px; margin: 32px auto 18px; max-width: 440px; color: var(--n400); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
      .onboard-divider::before, .onboard-divider::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
      .starter-grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .starter-chip { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border: 1.5px solid var(--n200); border-radius: 12px; background: var(--n25); cursor: pointer; transition: border-color .14s, box-shadow .14s, transform .12s; text-align: left; font-family: inherit; }
      .starter-chip:hover { border-color: var(--primary); box-shadow: var(--shadow-card); }
      .starter-chip:active { transform: scale(0.98); }
      .starter-chip img { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; }
      .starter-chip.sc-noimg::before { content: attr(data-letter); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--quote); color: var(--primary); font-weight: 800; font-size: 13px; flex-shrink: 0; }
      .starter-chip .sc-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--navy-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .starter-chip .sc-add { color: var(--n400); flex-shrink: 0; display: grid; place-items: center; transition: color .12s; }
      .starter-chip:hover .sc-add { color: var(--primary); }
      .starter-chip .sc-add svg { width: 16px; height: 16px; }

      /* ================= Home voice bar (voice, always present on Bookmarks) ================= */
      .voicebar { position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; background: linear-gradient(135deg, var(--navy), var(--navy-deep)); border-radius: 18px; padding: 15px 18px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
      .voicebar::after { content: ''; position: absolute; right: -50px; top: -50px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(49,209,255,0.20), transparent 70%); pointer-events: none; }
      .vb-orb { position: relative; flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; color: #fff; background: var(--primary); box-shadow: 0 6px 18px rgba(3,114,255,0.42); transition: transform .16s var(--ease), background .2s, color .2s, box-shadow .2s; }
      .vb-orb svg { width: 22px; height: 22px; }
      .vb-orb:hover { transform: scale(1.05); }
      .vb-orb:active { transform: scale(0.96); }
      .vb-orb.on { background: #fff; color: var(--primary); box-shadow: 0 0 0 6px rgba(49,209,255,0.30); }
      .vb-orb.on::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--cyan); animation: orbPulse 1.9s ease-out infinite; pointer-events: none; }
      .vb-orb:disabled { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.5); cursor: not-allowed; box-shadow: none; }
      .vb-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
      .vb-status { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-hi); display: inline-flex; align-items: center; gap: 7px; }
      .vb-status .st-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); }
      .vb-status.on .st-dot { background: #2bd576; animation: dotBlink 1.5s ease-out infinite; }
      .vb-line { font-size: 16px; font-weight: 600; color: #fff; margin-top: 4px; line-height: 1.35; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .vb-line.muted { color: rgba(255,255,255,0.68); font-weight: 500; }
      .vb-line .caret { display: inline-block; width: 2px; height: 1em; background: var(--cyan); margin-left: 2px; vertical-align: text-bottom; animation: caretBlink 1s step-end infinite; }
      .vb-hints { display: flex; gap: 7px; flex-shrink: 0; position: relative; z-index: 1; }
      .vb-hint { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.94); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; padding: 6px 13px; white-space: nowrap; }

      /* ============ Home action bar (listening · edit · add) ============ */
      .home-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .home-actions-spacer { flex: 1; }
      .home-listen {
        display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px;
        border-radius: 999px; border: 1.5px solid var(--n200); background: #fff; color: var(--navy-deep);
        font-size: 13px; font-weight: 700; cursor: pointer;
        transition: background .14s, border-color .14s, color .14s, transform .12s;
      }
      .home-listen:hover { border-color: var(--n300); background: var(--n50); }
      .home-listen:active { transform: scale(.98); }
      .home-listen svg { width: 16px; height: 16px; }
      .home-listen .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--n400); flex-shrink: 0; }
      .home-listen.on { background: var(--navy); border-color: var(--navy); color: #fff; }
      .home-listen.on .dot { background: #10b981; animation: statusPulse 1.5s ease-out infinite; }
      .home-listen.disabled { opacity: 0.55; cursor: not-allowed; }

      /* ===================== Home search ===================== */
      .home-search-row { display: flex; margin-bottom: 16px; }
      .home-search { flex: 1; position: relative; }
      .home-search .search-ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--n400); pointer-events: none; }
      .home-search input { padding-left: 42px; height: 46px; border-radius: 999px; }
      .home-search .clear-search { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: none; background: var(--n100); color: var(--n500); border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
      .home-search .clear-search:hover { background: var(--n200); color: var(--navy-deep); }
      .home-search .clear-search svg { width: 15px; height: 15px; }
      .home-add-btn { flex-shrink: 0; min-height: 44px; }

      /* Search results */
      .search-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
      .search-empty { text-align: center; padding: 54px 20px; color: var(--n500); }
      .search-empty svg { width: 34px; height: 34px; color: var(--n300); margin-bottom: 12px; }
      .search-empty p { font-size: 14px; line-height: 1.6; }
      .src-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--n200); border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .14s, box-shadow .14s; }
      .src-card:hover { border-color: var(--primary); box-shadow: var(--shadow-card); }
