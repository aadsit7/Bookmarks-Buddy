<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bookmarks Buddy — open your sites by voice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Bookmarks Buddy — save your favorite links and open them hands-free with your voice.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        /* Design tokens (carried over from the original product so Bookmarks
           Buddy still feels like the same family) */
        --navy: #1F289C;
        --navy-deep: #161F5B;
        --primary: #0372FF;
        --primary-hover: #0262DB;
        --primary-press: #014BAC;
        --cyan: #31D1FF;
        --cyan-hi: #7FE3FF;
        --dark: #161F5B;
        --gray: #4D5878;
        --muted-blue: #AAB6E8;
        --quote: #F0F6FF;
        --divider: #DCE2EC;
        --n25: #FBFCFE;
        --n50: #F5F7FB;
        --n100: #EDF0F7;
        --n200: #DCE2EC;
        --n300: #C3CBDC;
        --n400: #97A2BB;
        --n500: #6B7693;
        --n600: #4D5878;
        --green: #0F7A3F;
        --amber: #B45309;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow-card: 0 2px 6px rgba(22,31,91,0.08);
        --shadow-hover: 0 8px 24px rgba(22,31,91,0.10);
        --shadow-brand: 0 8px 24px rgba(3,114,255,0.22);
        --focus-ring: 0 0 0 4px rgba(3,114,255,0.25);
        --ease: cubic-bezier(.16,1,.3,1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; background: var(--n50); color: var(--dark); font-family: 'DM Sans', system-ui, sans-serif; }
      body { margin: 0; overflow: hidden; }
      #app { height: 100dvh; }
      *::-webkit-scrollbar { width: 9px; height: 9px; }
      *::-webkit-scrollbar-thumb { background: var(--n300); border-radius: 5px; }
      *::-webkit-scrollbar-track { background: transparent; }
      svg.lucide { width: 1em; height: 1em; }
      button { font-family: inherit; }
      :is(button, [role="button"], [role="switch"]):focus-visible { outline: none; box-shadow: var(--focus-ring); }

      input[type="text"], input[type="url"] {
        width: 100%; padding: 11px 14px; border: 1.5px solid var(--n200); border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 500; color: var(--navy-deep); background: #fff; outline: none;
        transition: border-color 0.16s, box-shadow 0.16s; font-family: inherit;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(3,114,255,0.12); }
      input::placeholder { color: var(--n400); font-weight: 500; }

      .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--primary); color: #fff; border: none; border-radius: 999px; padding: 11px 22px; min-height: 44px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: background 0.12s, transform 0.12s; }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-primary:active { transform: scale(0.98); }
      .btn-primary:disabled { background: var(--n200); color: #fff; cursor: not-allowed; }
      .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: transparent; color: var(--navy-deep); border: 1.5px solid var(--n300); border-radius: 999px; padding: 10px 18px; min-height: 42px; font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color 0.12s, color 0.12s, background 0.12s; }
      .btn-outline:hover { color: var(--primary); border-color: var(--primary); background: var(--quote); }
      .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--n100); border: none; color: var(--navy-deep); font-size: 12.5px; font-weight: 600; padding: 9px 15px; border-radius: 999px; cursor: pointer; transition: background 0.12s; }
      .btn-ghost:hover { background: var(--n200); }

      /* ================= App shell ================= */
      .shell { display: flex; flex-direction: column; height: 100dvh; }

      .topbar { display: flex; align-items: center; gap: 16px; padding: 0 20px; min-height: 62px; background: var(--navy); color: #fff; flex-shrink: 0; z-index: 20; }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, var(--primary), var(--cyan)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 14px rgba(3,114,255,0.4); flex-shrink: 0; }
      .brand-mark svg { width: 21px; height: 21px; }
      .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
      .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
      .brand-name .accent { color: var(--cyan); }
      .brand-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted-blue); margin-top: 2px; }

      .nav-tabs { display: flex; gap: 4px; margin-left: 8px; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 999px; }
      .nav-tab { display: inline-flex; align-items: center; gap: 7px; border: none; background: transparent; color: var(--muted-blue); font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background 0.14s, color 0.14s; }
      .nav-tab svg { width: 15px; height: 15px; }
      .nav-tab:hover { color: #fff; }
      .nav-tab.active { background: #fff; color: var(--navy); }

      .topbar-spacer { flex: 1; }

      /* Header listening pill — global mic switch, visible on every screen */
      .mic-pill { display: inline-flex; align-items: center; gap: 9px; border: 1.5px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #fff; font-size: 12.5px; font-weight: 700; padding: 9px 16px 9px 14px; border-radius: 999px; cursor: pointer; transition: background 0.14s, border-color 0.14s, transform 0.12s; }
      .mic-pill:hover { background: rgba(255,255,255,0.14); }
      .mic-pill:active { transform: scale(0.98); }
      .mic-pill svg { width: 16px; height: 16px; }
      .mic-pill.on { background: #fff; color: var(--navy); border-color: #fff; }
      .mic-pill.off .dot, .mic-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-blue); flex-shrink: 0; }
      .mic-pill.on .dot { background: #10b981; animation: statusPulse 1.5s ease-out infinite; }
      .mic-pill.disabled { opacity: 0.55; cursor: not-allowed; }
      @keyframes statusPulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); } 100% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } }

      .page { flex: 1; min-height: 0; overflow-y: auto; background: var(--n50); }

      /* ================= Home: side-by-side ================= */
      .home { max-width: 1180px; margin: 0 auto; padding: 24px 22px 40px; }
      .home-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 22px; align-items: start; }

      .panel { background: #fff; border: 1px solid var(--divider); border-radius: var(--radius); box-shadow: var(--shadow-card); overflow: hidden; }
      .panel-head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--divider); }
      .panel-head-ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; background: var(--quote); color: var(--primary); }
      .panel-head-ic svg { width: 20px; height: 20px; }
      .panel-head-ic.cyan { background: rgba(49,209,255,0.16); color: var(--navy-deep); }
      .panel-titles { flex: 1; min-width: 0; }
      .panel-title { font-size: 16px; font-weight: 800; color: var(--navy-deep); letter-spacing: -0.01em; }
      .panel-sub { font-size: 12px; color: var(--n500); margin-top: 2px; line-height: 1.35; }
      .panel-body { padding: 18px 22px 22px; }

      /* Add-bookmark form */
      .bm-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; }
      .bm-add .btn-primary { min-height: 44px; padding: 0 18px; }
      .bm-add-hint { font-size: 11.5px; color: var(--n500); margin-top: 9px; display: flex; align-items: center; gap: 6px; }
      .bm-add-hint svg { width: 13px; height: 13px; color: var(--n400); }

      .bm-divider { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 12px; }
      .bm-count { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n500); }

      .bm-list { display: flex; flex-direction: column; gap: 8px; }
      .bm-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 1.5px solid var(--n200); border-radius: 12px; background: var(--n25); transition: border-color 0.14s, box-shadow 0.14s, background 0.14s; }
      .bm-item:hover { border-color: var(--n300); box-shadow: var(--shadow-card); }
      .bm-item.matched { border-color: var(--cyan); background: var(--quote); box-shadow: 0 0 0 4px rgba(49,209,255,0.18); animation: matchPop 0.4s var(--ease); }
      @keyframes matchPop { 0% { transform: scale(0.99); } 50% { transform: scale(1.012); } 100% { transform: scale(1); } }
      .bm-fav { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; background: #fff; border: 1px solid var(--n200); overflow: hidden; color: var(--primary); font-weight: 800; font-size: 15px; }
      .bm-fav img { width: 20px; height: 20px; display: block; }
      .bm-body { flex: 1; min-width: 0; cursor: pointer; }
      .bm-name { font-size: 14px; font-weight: 700; color: var(--navy-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bm-url { font-size: 11.5px; color: var(--n500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .bm-actions { display: flex; gap: 4px; flex-shrink: 0; }
      .bm-actions button { width: 34px; height: 34px; border-radius: 9px; border: none; background: transparent; color: var(--n500); cursor: pointer; display: grid; place-items: center; transition: background 0.12s, color 0.12s; }
      .bm-actions button svg { width: 16px; height: 16px; }
      .bm-actions button:hover { background: var(--n100); color: var(--navy-deep); }
      .bm-actions button.open:hover { background: var(--quote); color: var(--primary); }
      .bm-actions button.del:hover { background: #fee2e2; color: #dc2626; }

      /* Inline edit + delete-confirm */
      .bm-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }
      .bm-edit input { padding: 8px 11px; font-size: 13px; }
      .bm-confirm { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; }
      .bm-confirm span { font-size: 12.5px; font-weight: 600; color: #b91c1c; }
      .bm-confirm .yes { background: #dc2626; color: #fff; border: none; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
      .bm-confirm .yes:hover { background: #b91c1c; }

      .bm-empty { text-align: center; padding: 30px 16px; color: var(--n500); }
      .bm-empty svg { width: 30px; height: 30px; color: var(--n300); margin-bottom: 10px; }
      .bm-empty p { font-size: 13px; line-height: 1.6; }

      .save-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider); }
      .save-status { font-size: 12px; font-weight: 600; color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
      .save-status svg { width: 14px; height: 14px; }

      /* ================= Voice panel ================= */
      .vp-body { padding: 26px 22px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; }

      .orb-wrap { position: relative; width: 132px; height: 132px; display: grid; place-items: center; flex-shrink: 0; }
      .orb-wrap .orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--cyan); opacity: 0; pointer-events: none; }
      .orb-wrap.live .orb-ring { animation: orbPulse 1.9s ease-out infinite; opacity: .5; }
      .orb-wrap.live .orb-ring.d { animation-delay: .95s; }
      @keyframes orbPulse { 0%{transform:scale(1);opacity:.55} 100%{transform:scale(1.5);opacity:0} }
      .voice-orb { position: relative; z-index: 1; width: 108px; height: 108px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; color: #fff; background: var(--primary); box-shadow: var(--shadow-brand); transition: transform .18s var(--ease), background .2s, box-shadow .2s, color .2s; }
      .voice-orb svg { width: 38px; height: 38px; }
      .voice-orb:hover { transform: scale(1.04); }
      .voice-orb:active { transform: scale(.97); }
      .voice-orb.off:hover { background: var(--primary-hover); }
      .voice-orb.on { background: #fff; color: var(--primary); box-shadow: 0 0 0 7px rgba(49,209,255,.26), var(--shadow-hover); }
      .voice-orb:disabled { background: var(--n100); color: var(--n400); cursor: not-allowed; box-shadow: none; transform: none; }

      .vp-status { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--navy-deep); background: var(--n100); padding: 7px 16px; border-radius: 999px; }
      .vp-status .st-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--n400); flex-shrink: 0; }
      .vp-status.on { background: var(--quote); color: var(--navy); }
      .vp-status.on .st-dot { background: #10b981; animation: dotBlink 1.5s ease-out infinite; }
      @keyframes dotBlink { 50% { opacity: 0.35; } }

      .vp-transcript { margin-top: 18px; width: 100%; min-height: 46px; font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--navy-deep); letter-spacing: -0.01em; text-wrap: pretty; overflow-wrap: break-word; }
      .vp-transcript.muted { color: var(--n400); font-weight: 500; font-size: 14px; }
      .vp-transcript .caret { display: inline-block; width: 2px; height: 1em; background: var(--primary); margin-left: 2px; vertical-align: text-bottom; animation: caretBlink 1s step-end infinite; }
      @keyframes caretBlink { 50% { opacity: 0; } }

      .vp-examples { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
      .vp-chip { font-size: 12px; font-weight: 600; color: var(--n600); background: var(--n50); border: 1px solid var(--n200); border-radius: 999px; padding: 6px 13px; }
      .vp-chip b { color: var(--primary); font-weight: 700; }

      /* Keyboard-shortcut hint (Ctrl+Alt+B launches listening) */
      .vp-shortcut { margin-top: 16px; font-size: 12px; font-weight: 600; color: var(--n500); line-height: 1.95; }
      kbd { display: inline-block; font-family: inherit; font-size: 11px; font-weight: 700; line-height: 1; color: var(--navy-deep); background: #fff; border: 1px solid var(--n300); border-bottom-width: 2px; border-radius: 6px; padding: 3px 6px; vertical-align: baseline; }

      .vp-options { margin-top: 20px; width: 100%; padding-top: 16px; border-top: 1px solid var(--divider); display: flex; flex-direction: column; gap: 10px; }
      .opt-row { display: flex; align-items: center; gap: 12px; text-align: left; }
      .opt-row .opt-text { flex: 1; min-width: 0; }
      .opt-title { font-size: 13px; font-weight: 700; color: var(--navy-deep); }
      .opt-sub { font-size: 11.5px; color: var(--n500); line-height: 1.35; margin-top: 1px; }

      .switch { position: relative; display: inline-flex; align-items: center; width: 44px; height: 24px; border-radius: 999px; background: var(--n300); cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
      .switch.on { background: var(--primary); }
      .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.2s; box-shadow: 0 1px 3px rgba(22,31,91,0.2); }
      .switch.on::after { left: 22px; }

      /* Recent actions */
      .recent { margin-top: 22px; }
      .recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .recent-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--n500); }
      .recent-clear { font-size: 11.5px; font-weight: 600; color: var(--n500); background: none; border: none; cursor: pointer; }
      .recent-clear:hover { color: var(--primary); }
      .recent-list { display: flex; flex-direction: column; gap: 7px; }
      .recent-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; background: var(--n25); border: 1px solid var(--n200); }
      .recent-ic { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; }
      .recent-ic svg { width: 15px; height: 15px; }
      .recent-ic.opened { background: var(--quote); color: var(--primary); }
      .recent-ic.added { background: #ecfdf5; color: var(--green); }
      .recent-ic.blocked { background: #fffbeb; color: var(--amber); }
      .recent-ic.notfound { background: #fef2f2; color: #dc2626; }
      .recent-ic.info { background: var(--n100); color: var(--n600); }
      .recent-body { flex: 1; min-width: 0; }
      .recent-main { font-size: 13px; font-weight: 600; color: var(--navy-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .recent-time { font-size: 11px; color: var(--n500); margin-top: 1px; }
      .recent-empty { font-size: 12.5px; color: var(--n500); text-align: center; padding: 16px; line-height: 1.6; }

      /* Pending-open banner (popup blocked → one tap to open) */
      .pending { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 13px 15px; border-radius: 12px; background: #fffbeb; border: 1.5px solid #fcd34d; animation: slideDown 0.22s var(--ease); }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
      .pending-ic { width: 36px; height: 36px; border-radius: 10px; background: #fef3c7; color: var(--amber); display: grid; place-items: center; flex-shrink: 0; }
      .pending-ic svg { width: 19px; height: 19px; }
      .pending-body { flex: 1; min-width: 0; }
      .pending-title { font-size: 13.5px; font-weight: 700; color: #92400e; }
      .pending-sub { font-size: 11.5px; color: #b45309; margin-top: 1px; line-height: 1.4; }
      .pending .btn-primary { background: var(--amber); min-height: 40px; padding: 0 18px; }
      .pending .btn-primary:hover { background: #92400e; }
      .pending-x { width: 32px; height: 32px; border: none; background: transparent; color: #b45309; border-radius: 8px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
      .pending-x:hover { background: rgba(180,83,9,0.12); }

      /* ================= Focus screen ================= */
      .focus { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 5vh 22px 40px; }
      .focus-inner { width: 100%; max-width: 620px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .focus .orb-wrap { width: 184px; height: 184px; margin-bottom: 6px; }
      .focus .voice-orb { width: 150px; height: 150px; }
      .focus .voice-orb svg { width: 52px; height: 52px; }
      .focus-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy-deep); margin-top: 22px; }
      .focus-sub { font-size: 14px; color: var(--gray); line-height: 1.6; margin-top: 8px; max-width: 440px; }
      .focus-transcript { margin-top: 26px; width: 100%; min-height: 54px; font-size: 24px; font-weight: 600; line-height: 1.4; color: var(--navy-deep); letter-spacing: -0.01em; text-wrap: pretty; overflow-wrap: break-word; }
      .focus-transcript.muted { color: var(--n400); font-weight: 500; font-size: 17px; }
      .focus-transcript .caret { display: inline-block; width: 3px; height: 1em; background: var(--primary); margin-left: 3px; vertical-align: text-bottom; animation: caretBlink 1s step-end infinite; }
      .focus-recent { margin-top: 30px; width: 100%; max-width: 480px; text-align: left; }

      /* ================= Toast ================= */
      .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 200; background: var(--navy-deep); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 20px 48px rgba(22,31,91,0.32); pointer-events: none; animation: toastIn 0.25s ease-out; max-width: min(92vw, 480px); text-align: center; display: inline-flex; align-items: center; gap: 9px; }
      .toast svg { width: 17px; height: 17px; flex-shrink: 0; }
      @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

      /* ================= iPhone-style springboard ================= */
      /* The bookmarks page is laid out like an iPhone home screen: a grid of
         app icons (the website URLs) spread across swipeable pages, folders to
         group them, and a pencil button (bottom-left) that enters "jiggle"
         edit mode for dragging things around. */
      .home-springboard { max-width: 1080px; margin: 0 auto; padding: 22px 22px 30px; }

      .springboard {
        position: relative;
        display: flex; flex-direction: column;
        min-height: min(70vh, 720px);
        border-radius: 30px;
        padding: 16px 12px 0;
        overflow: hidden;
        background:
          radial-gradient(120% 80% at 18% 0%, rgba(127,227,255,0.32), transparent 60%),
          radial-gradient(120% 90% at 100% 100%, rgba(3,114,255,0.5), transparent 55%),
          linear-gradient(160deg, var(--navy), var(--navy-deep));
        box-shadow: var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,0.14);
      }

      .sb-viewport { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
      .sb-track { display: flex; height: 100%; transition: transform .32s var(--ease); will-change: transform; }
      .sb-page {
        flex: 0 0 auto;
        display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: min-content;
        gap: 16px 6px; align-content: start; padding: 10px 12px 16px;
      }
